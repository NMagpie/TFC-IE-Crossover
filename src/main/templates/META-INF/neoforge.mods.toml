modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/NMagpie/TFC-IE-Crossover/issues"

[[mods]]
modId = "tfc_ie_addon"
version = "${modVersion}"
displayName = "TFC + IE Crossover"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/tfc-ie-crossover"
logoFile = "logo.png"
credits = '''
Thanks to Developers of such wonderful mods as TerraFirmaCraft: TNG and Immersive Engineering.
Especially to EERussianguy, whose addon FirmaLife was used as base for this addon.
Some textures of BluSunrize were used or modified.\nAlso, were used some textures from TFC: TNG, all credits to the developers.
'''
authors = "NMagpie and maintained by HermitOwO"
description = "Addon that makes TFC and IE compatible."
updateJSONURL = "https://raw.githubusercontent.com/NMagpie/TFC-IE-Crossover/1.21.x/update.json"

[[dependencies.tfc_ie_addon]]
modId = "neoforge"
type = "required"
versionRange = "${neoForgeVersionRange}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tfc_ie_addon]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftVersionRange}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tfc_ie_addon]]
modId = "tfc"
type = "required"
versionRange = "${tfcVersionRange}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tfc_ie_addon]]
modId = "immersiveengineering"
type = "required"
versionRange = "${ieVersionRange}"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${modId}.mixins.json"